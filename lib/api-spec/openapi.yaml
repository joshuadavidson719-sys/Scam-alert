openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: swiftop
    description: Swiftop AI image and animation generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /swiftop/generate-image:
    post:
      operationId: generateImage
      tags: [swiftop]
      summary: Generate an AI image
      description: Generates a single AI image from a text prompt using gpt-image-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateImageBody"
      responses:
        "200":
          description: Generated image as base64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateImageResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /swiftop/generate-animation:
    post:
      operationId: generateAnimation
      tags: [swiftop]
      summary: Generate an AI animation as a sequence of frames
      description: Generates multiple AI image frames from a text prompt to create an animated sequence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateAnimationBody"
      responses:
        "200":
          description: Animated frames as base64 images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateAnimationResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    GenerateImageBody:
      type: object
      properties:
        prompt:
          type: string
          description: Text description of the image to generate
          minLength: 1
          maxLength: 4000
        size:
          type: string
          enum: ["1024x1024", "1536x1024", "1024x1536"]
          description: Output image size (default 1024x1024)
      required:
        - prompt

    GenerateImageResponse:
      type: object
      properties:
        b64_json:
          type: string
          description: Base64-encoded PNG image
        prompt:
          type: string
      required:
        - b64_json
        - prompt

    GenerateAnimationBody:
      type: object
      properties:
        prompt:
          type: string
          description: Text description of the animation scene to generate
          minLength: 1
          maxLength: 4000
        frameCount:
          type: integer
          minimum: 4
          maximum: 12
          description: Number of frames to generate (default 8)
        style:
          type: string
          enum: ["flow", "zoom", "pan", "morph"]
          description: Animation style preset (default flow)
        fps:
          type: integer
          minimum: 4
          maximum: 16
          description: Target playback FPS hint (default 8)
      required:
        - prompt

    GenerateAnimationResponse:
      type: object
      properties:
        frames:
          type: array
          items:
            type: string
          description: Array of base64-encoded PNG frames
        prompt:
          type: string
        frameCount:
          type: integer
      required:
        - frames
        - prompt
        - frameCount

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
