openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: swiftop
    description: Swiftop AI image and animation generation
paths:
  /institutions/billing:
    get:
      operationId: getInstitutionBilling
      tags: [institutions]
      responses:
        "200":
          description: Current institutional offers read from Whop.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionBilling"
        default:
          description: Billing request failed. The response contains an error message.
  /institutions/checkout:
    post:
      operationId: createInstitutionCheckout
      tags: [institutions]
      description: Create hosted checkout for an authenticated institution representative. Does not grant access or charge a card.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitutionCheckoutRequest"
      responses:
        "200":
          description: Hosted Whop checkout URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionCheckout"
        default:
          description: Billing request failed. The response contains an error message.
  /post-media/uploads:
    post:
      operationId: authorizePostMediaUpload
      tags: [posts]
      description: Authenticated Vercel Blob client-upload handshake. File bytes upload directly to private Blob storage, not through this API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostMediaUploadHandshake"
      responses:
        "200":
          description: Short-lived upload credential scoped to one owned pathname, allowed media types and a 100 MB limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostMediaUploadAuthorization"
        default:
          description: Upload could not be authorized
  /post-media/{uid}/{filename}:
    get:
      operationId: getPostMedia
      tags: [posts]
      description: Stream community post media; supports HTTP byte ranges for video playback and seeking.
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
        - name: filename
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Full media stream
        "206":
          description: Requested byte range
        "404":
          description: Media does not exist
        "416":
          description: Unsupported byte range
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /swiftop/generate-image:
    post:
      operationId: generateImage
      tags: [swiftop]
      summary: Generate an AI image
      description: Generates a single AI image from a text prompt using gpt-image-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateImageBody"
      responses:
        "200":
          description: Generated image as base64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateImageResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /swiftop/generate-animation:
    post:
      operationId: generateAnimation
      tags: [swiftop]
      summary: Generate an AI animation as a sequence of frames
      description: Generates multiple AI image frames from a text prompt to create an animated sequence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateAnimationBody"
      responses:
        "200":
          description: Animated frames as base64 images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateAnimationResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    InstitutionOffer:
      type: object
      required: [market, available, currency, amount, billingDays, formattedPrice, message]
      properties:
        market:
          type: string
          enum: [ec, ca]
        available:
          type: boolean
        currency:
          type: string
        amount:
          type: number
        billingDays:
          type: integer
        formattedPrice:
          type: string
        message:
          type: string
    InstitutionBilling:
      type: object
      required: [offers, manageUrl]
      properties:
        offers:
          type: array
          items:
            $ref: "#/components/schemas/InstitutionOffer"
        manageUrl:
          type: string
    InstitutionCheckoutRequest:
      type: object
      additionalProperties: false
      required: [market, institutionName, acceptedBillingTerms, requestId]
      properties:
        market:
          type: string
          enum: [ec, ca]
        institutionName:
          type: string
          minLength: 2
          maxLength: 150
        acceptedBillingTerms:
          type: boolean
          enum: [true]
        requestId:
          type: string
          pattern: '^[a-f0-9-]{36}    PostMediaUploadHandshake:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [blob.generate-client-token]
        payload:
          type: object
          required: [pathname]
          properties:
            pathname:
              type: string
            clientPayload:
              type: ["string", "null"]
            multipart:
              type: boolean
    PostMediaUploadAuthorization:
      type: object
      required: [type, clientToken]
      properties:
        type:
          type: string
        clientToken:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    GenerateImageBody:
      type: object
      properties:
        prompt:
          type: string
          description: Text description of the image to generate
          minLength: 1
          maxLength: 4000
        size:
          type: string
          enum: ["1024x1024", "1536x1024", "1024x1536"]
          description: Output image size (default 1024x1024)
      required:
        - prompt

    GenerateImageResponse:
      type: object
      properties:
        b64_json:
          type: string
          description: Base64-encoded PNG image
        prompt:
          type: string
      required:
        - b64_json
        - prompt

    GenerateAnimationBody:
      type: object
      properties:
        prompt:
          type: string
          description: Text description of the animation scene to generate
          minLength: 1
          maxLength: 4000
        frameCount:
          type: integer
          minimum: 4
          maximum: 12
          description: Number of frames to generate (default 8)
        style:
          type: string
          enum: ["flow", "zoom", "pan", "morph"]
          description: Animation style preset (default flow)
        fps:
          type: integer
          minimum: 4
          maximum: 16
          description: Target playback FPS hint (default 8)
      required:
        - prompt

    GenerateAnimationResponse:
      type: object
      properties:
        frames:
          type: array
          items:
            type: string
          description: Array of base64-encoded PNG frames
        prompt:
          type: string
        frameCount:
          type: integer
      required:
        - frames
        - prompt
        - frameCount

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    InstitutionCheckout:
      type: object
      required: [purchaseUrl, checkoutId]
      properties:
        purchaseUrl:
          type: string
        checkoutId:
          type: string
    PostMediaUploadHandshake:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [blob.generate-client-token]
        payload:
          type: object
          required: [pathname]
          properties:
            pathname:
              type: string
            clientPayload:
              type: ["string", "null"]
            multipart:
              type: boolean
    PostMediaUploadAuthorization:
      type: object
      required: [type, clientToken]
      properties:
        type:
          type: string
        clientToken:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    GenerateImageBody:
      type: object
      properties:
        prompt:
          type: string
          description: Text description of the image to generate
          minLength: 1
          maxLength: 4000
        size:
          type: string
          enum: ["1024x1024", "1536x1024", "1024x1536"]
          description: Output image size (default 1024x1024)
      required:
        - prompt

    GenerateImageResponse:
      type: object
      properties:
        b64_json:
          type: string
          description: Base64-encoded PNG image
        prompt:
          type: string
      required:
        - b64_json
        - prompt

    GenerateAnimationBody:
      type: object
      properties:
        prompt:
          type: string
          description: Text description of the animation scene to generate
          minLength: 1
          maxLength: 4000
        frameCount:
          type: integer
          minimum: 4
          maximum: 12
          description: Number of frames to generate (default 8)
        style:
          type: string
          enum: ["flow", "zoom", "pan", "morph"]
          description: Animation style preset (default flow)
        fps:
          type: integer
          minimum: 4
          maximum: 16
          description: Target playback FPS hint (default 8)
      required:
        - prompt

    GenerateAnimationResponse:
      type: object
      properties:
        frames:
          type: array
          items:
            type: string
          description: Array of base64-encoded PNG frames
        prompt:
          type: string
        frameCount:
          type: integer
      required:
        - frames
        - prompt
        - frameCount

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
