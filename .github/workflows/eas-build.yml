name: EAS Build Android

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > artifacts/scam-alert/google-services.json

      - name: Patch app.json
        working-directory: artifacts/scam-alert
        run: |
          python3 -c "
          import json
          with open('app.json') as f:
              data = json.load(f)
          expo = data['expo']
          expo.setdefault('extra', {}).setdefault('eas', {})['projectId'] = 'f2d37f46-6661-493f-a937-844ff302ad07'
          expo.setdefault('android', {})['package'] = 'com.spicetech.scamalert'
          expo.setdefault('ios', {})['bundleIdentifier'] = 'com.spicetech.scamalert'
          with open('app.json', 'w') as f:
              json.dump(data, f, indent=2)
                    "

      - name: Run EAS Build
        working-directory: artifacts/scam-alert
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_FIREBASE_CONFIG: ${{ secrets.EXPO_PUBLIC_FIREBASE_CONFIG }}
        run: eas build --platform android --profile production --non-interactive
