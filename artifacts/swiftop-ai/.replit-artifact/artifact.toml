kind = "web"
previewPath = "/swiftop-ai/"
title = "Swiftop AI"
version = "1.0.0"
id = "artifacts/swiftop-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/swiftop-ai/" ]
localPort = 20179

[services.development]
run = "pnpm --filter @workspace/swiftop-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/swiftop-ai", "run", "build" ]
publicDir = "artifacts/swiftop-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20179"
BASE_PATH = "/swiftop-ai/"
